[project]
name = "braidpipe-py"
version = "0.1.0"
description = "Async data orchestration in YAML. One playbook, one Braid."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.50"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
braidpipe = "braidpipe.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braidpipe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20261103",
]
